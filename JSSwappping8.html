<html>
<body>
<script>
let a, b, c;

a = parseInt(prompt("Enter value of a:"));
b = parseInt(prompt("Enter value of b:"));

// swapping using third variable
c = a;
a = b;
b = c;

// output
document.write("After swapping:<br>");
document.write("a = " + a + "<br>");
document.write("b = " + b);
</script>
</body>
</html>
