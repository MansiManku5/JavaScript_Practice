<html>
<body>
    <input type="text" id="t1">
    <input type="button" value="Ok" onclick="show()">
    <p id="result"></p>

<script>
function show()
{
    let a;
     a= parseInt(document.getElementById("t1").value);

    if(a % 2 == 0){
        document.getElementById("result").innerHTML = "Even";
    }
    else{
        document.getElementById("result").innerHTML = "Odd";
    }
}
</script>
</body>
</html>
